<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Web Radio</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><img src="images/esp_logo_160.png" alt="ESP Logo" class="header-logo"> Web Radio</h1>
            <div class="status">
                <div class="status-item" id="connection-status-wrapper">
                    <span id="connection-status">Подключение...</span>
                </div>
                <div class="status-item">
                    <span id="current-time">--:--</span>
                </div>
                <div class="status-item" id="signal-strength-wrapper">
                    <span id="signal-strength">Сигнал: --</span>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="radio-display">
                <div class="frequency-display" id="frequency">Веб Радио</div>
                <div class="station-name" id="station-name">Выберите станцию</div>
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <div>Подключение к станции...</div>
                </div>
            </div>

            <div class="quick-controls">
                <button class="btn" id="stop-btn" onclick="stopRadio()">⏹️ Остановить</button>
                <button class="btn" id="mute-btn" onclick="toggleMute()">🔊 Звук</button>
                <div class="volume-wrapper">
                    <input type="range" min="0" max="100" value="50" id="volume-slider" oninput="setVolume(this.value)">
                    <span id="volume-value">50</span>
                </div>
            </div>

            <div class="controls">
                <div class="control-group collapsed">
                    <h3 onclick="toggleControlGroup(this)">Избранное</h3>
                    <div class="control-content">
                        <div class="preset-stations">
                            <div id="favorites-list" class="favorites-list"></div>
                        </div>
                    </div>
                </div>

                <div class="control-group collapsed">
                    <h3 onclick="toggleControlGroup(this)">Плейлист</h3>
                    <div class="control-content">
                        <div class="playlist-controls">
                            <div class="search-container">
                                <button class="btn btn-primary" onclick="loadPlaylist(true)">🔄 Загрузить</button>
                                <div class="search-input-wrapper">
                                    <input type="text" id="channel-search" placeholder="Поиск (Enter, Esc)" />
                                    <button class="btn btn-secondary" onclick="clearSearch()" title="Очистить поиск">🗑️</button>
                                </div>
                            </div>
                            <div class="playlist-info">
                                <span id="playlist-status"></span>
                                <span id="channels-count">Каналов: 0</span>
                                <span id="search-status" style="display: none;">🔍 Поиск...</span>
                            </div>
                            <div class="pagination-controls">
                                <button class="btn btn-primary" onclick="firstPage()" id="first-btn" disabled>⏮️ Первая</button>
                                <button class="btn btn-primary" onclick="previousPage()" id="prev-btn" disabled>⬅️ Назад</button>
                                <span id="page-info">Страница 0 из 0</span>
                                <button class="btn btn-primary" onclick="nextPage()" id="next-btn" disabled>Вперед ➡️</button>
                                <button class="btn btn-primary" onclick="lastPage()" id="last-btn" disabled>Последняя ⏭️</button>
                            </div>
                        </div>
                        <div class="channels-list" id="channels-list">
                            <div class="loading-channels" id="loading-channels" style="display: none;">
                                <div class="spinner"></div>
                                <div>Загрузка каналов...</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="control-group collapsed" style="display: none;">
                    <h3 onclick="toggleControlGroup(this)">Топ 30</h3>
                    <div class="control-content">
                        <div id="top-channels-list" class="channels-list"></div>
                    </div>
                </div>

                <div class="control-group collapsed">
                    <h3 onclick="toggleControlGroup(this)">Эквалайзер</h3>
                    <div class="control-content">
                        <div class="button-group">
                            <button class="btn btn-primary" onclick="setEqPreset(0)">Default</button>
                            <button class="btn btn-primary" onclick="setEqPreset(1)">Dance</button>
                            <button class="btn btn-primary" onclick="setEqPreset(2)">Bass</button>
                            <button class="btn btn-primary" onclick="setEqPreset(3)">Treble</button>
                            <button class="btn btn-primary" onclick="setEqPreset(4)">Pop</button>
                            <button class="btn btn-primary" onclick="setEqPreset(5)">Rock</button>
                            <button class="btn btn-primary" onclick="setEqPreset(6)">Soft</button>
                            <button class="btn btn-primary" onclick="setEqPreset(7)">Hall</button>
                            <button class="btn btn-primary" onclick="setEqPreset(8)">Party</button>
                            <button class="btn btn-primary" onclick="setEqPreset(9)">Club</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>&copy; 2025 ESP32 Web Radio Controller</p>
            <p>Сделано с ❤️</p>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script src="js/playlist.js"></script>
</body>
</html>
